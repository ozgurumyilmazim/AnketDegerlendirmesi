server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    # Statik ön yüz dosyalarınızın sunulması (./frontend dizini buraya bağlanır)
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html; # SPA (Single Page Application) yönlendirme desteği
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }

    # PostgREST API Yönlendirmesi
    location /api/ {
        proxy_pass http://postgrest_api_upstream/;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # pgAdmin Yönlendirmesi
    location /pgadmin/ {
        proxy_pass http://pgadmin_upstream;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Script-Name /pgadmin;
    }

    location /dbcheck {
        proxy_pass http://setup_runner_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /status {
        proxy_pass http://setup_runner_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /execute {
        proxy_pass http://setup_runner_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /reset {
        proxy_pass http://setup_runner_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /e2e/ {
        proxy_pass http://e2e_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Script-Name /e2e;
    }

    # E2E Test Runner Yönlendirmesi (host üzerinde node server.js ile çalışır)
    location /test-runner/ {
        proxy_pass http://test_runner_upstream/;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    #location /tests/ {
    #    proxy_pass http://postgrest_api_upstream/;

    #    proxy_http_version 1.1;
    #    proxy_set_header Connection "";

    #    proxy_set_header Host $host;
    #    proxy_set_header X-Real-IP $remote_addr;
    #    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    #    proxy_set_header X-Forwarded-Proto $scheme;
    #}

    # Güvenlik Başlıkları
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

# --- UPSTREAM SUNUCULARI ---
# docker-compose.yml dosyanızdaki yeni servis isimleri (api ve pgadmin) ile eşleştirildi.

upstream postgrest_api_upstream {
    server api:3000; 
    keepalive 64;
}

upstream pgadmin_upstream {
    server pgadmin:80; 
    keepalive 64;
}

upstream e2e_upstream {
    server e2e:9323; 
    keepalive 64;
}

upstream test_runner_upstream {
    server e2e:3099; 
    keepalive 64;
}
upstream setup_runner_upstream {
    server setup_runner:3098;
    keepalive 64;
}
