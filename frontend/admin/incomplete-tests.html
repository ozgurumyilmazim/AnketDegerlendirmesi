<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tamamlanmamış Testler - MMPI Admin</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <!-- DataTables CSS -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.7/css/dataTables.bootstrap5.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="style.css">

    <style>
        .filter-card {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .content-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
            border: none;
        }

        .action-btn {
            padding: 0.25rem 0.5rem;
            border-radius: 5px;
            font-size: 0.85rem;
        }
    </style>
</head>

<body>
    <!-- Include Sidebar -->
    <div id="sidebar-container"></div>

    <!-- Main Content -->
    <div class="main-content" id="mainContent">
        <!-- Top Navbar -->
        <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom shadow-sm">
            <div class="container-fluid">
                <button class="sidebar-toggle d-md-none me-3 btn btn-light" onclick="toggleSidebar()">
                    <i class="fas fa-bars text-dark"></i>
                </button>

                <button class="sidebar-toggle d-none d-md-block me-3 btn btn-light" onclick="collapseSidebar()">
                    <i class="fas fa-bars text-dark"></i>
                </button>

                <h4 class="mb-0 text-dark fw-bold">
                    <i class="fas fa-user-clock text-warning me-2"></i>Tamamlanmamış Testler
                </h4>

                <div class="ms-auto d-flex align-items-center">
                    <div class="dropdown">
                        <button class="btn btn-link dropdown-toggle d-flex align-items-center text-decoration-none" type="button"
                            data-bs-toggle="dropdown">
                            <div class="user-avatar me-2 bg-primary text-white rounded-circle d-flex align-items-center justify-content-center" style="width: 35px; height: 35px;">
                                <span id="userInitials">A</span>
                            </div>
                            <span id="userName" class="text-dark fw-medium">Admin</span>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li>
                                <a class="dropdown-item text-danger" href="#" onclick="AuthService.logout()">
                                    <i class="fas fa-sign-out-alt me-2"></i>Çıkış Yap
                                </a>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </nav>

        <!-- Content Body -->
        <div class="container-fluid p-4">

            <!-- Filter Card -->
            <div class="filter-card border">
                <div class="row g-3">
                    <div class="col-md-4">
                        <label for="filterSearch" class="form-label fw-bold">Katılımcı / TC No</label>
                        <input type="text" class="form-control" id="filterSearch" placeholder="Katılımcı adı veya TC No ara...">
                    </div>
                    <div class="col-md-4">
                        <label for="filterSessionCode" class="form-label fw-bold">Oturum Devam Kodu</label>
                        <input type="text" class="form-control text-uppercase" id="filterSessionCode" placeholder="Örn: CAXRCNBTWJH">
                    </div>
                    <div class="col-md-4">
                        <label for="filterStatus" class="form-label fw-bold">Durum</label>
                        <select class="form-select" id="filterStatus">
                            <option value="">Tümü (Devam Ediyor & Başlatıldı)</option>
                            <option value="in_progress">Devam Ediyor (in_progress)</option>
                            <option value="started">Başlatıldı (started)</option>
                        </select>
                    </div>
                </div>
                <div class="row mt-3">
                    <div class="col-12 d-flex justify-content-between">
                        <div>
                            <button class="btn btn-outline-secondary btn-sm me-2" id="clearFiltersBtn">
                                <i class="fas fa-undo me-1"></i>Filtreleri Temizle
                            </button>
                        </div>
                        <small class="text-muted align-self-center">
                            <i class="fas fa-info-circle me-1"></i>Kullanıcılar "Kaydet ve Çık" yaptığında veya otomatik kaydedildiğinde burada listelenir.
                        </small>
                    </div>
                </div>
            </div>

            <!-- Table Card -->
            <div class="content-card">
                <div class="p-3 border-bottom d-flex justify-content-between align-items-center">
                    <h5 class="mb-0 fw-bold">
                        <i class="fas fa-hourglass-half text-primary me-2"></i>Devam Eden Test Oturumları
                    </h5>
                    <span class="badge bg-primary fs-6" id="totalCountBadge">0 kayıt</span>
                </div>

                <div class="p-3">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle" id="incompleteTestsTable" style="width:100%">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Oturum Kodu</th>
                                    <th>Katılımcı</th>
                                    <th>İlerleme</th>
                                    <th>Son Güncelleme</th>
                                    <th>Durum</th>
                                    <th>İşlemler</th>
                                </tr>
                            </thead>
                            <tbody>
                                <!-- Data rendered via DataTables -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Detail Modal -->
    <div class="modal fade" id="incompleteDetailModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content border-0 shadow">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title fw-bold">
                        <i class="fas fa-info-circle me-2"></i>Tamamlanmamış Test Oturumu Detayı
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Kapat"></button>
                </div>
                <div class="modal-body" id="incompleteDetailModalBody">
                    <!-- Dynamic modal content -->
                </div>
                <div class="modal-footer bg-light">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Kapat</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.7/js/dataTables.bootstrap5.min.js"></script>

    <!-- Core App Config & Auth Scripts -->
    <script src="../assets/js/pg-config.js"></script>
    <script src="../assets/js/page-permissions.js"></script>
    <script src="../assets/js/incomplete-tests.js"></script>

    <script>
        // Load sidebar dynamically
        $(document).ready(function () {
            $("#sidebar-container").load("sidebar.html", function() {
                // Highlight link
                const link = document.getElementById('nav-incomplete-tests');
                if (link) link.classList.add('active');
            });
        });
    </script>
</body>

</html>
