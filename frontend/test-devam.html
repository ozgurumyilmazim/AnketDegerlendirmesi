<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste Devam Et - MMPI Test</title>
    <link rel="icon" type="image/svg+xml" href="favicon.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="assets/js/pg-config.js"></script>
</head>
<body>
    <div class="container-fluid min-vh-100 d-flex align-items-center justify-content-center bg-light">
        <div class="row w-100">
            <div class="col-md-8 col-lg-6 mx-auto">
                <div class="card shadow-lg border-0">
                    <div class="card-header bg-primary text-white text-center">
                        <h2 class="mb-0">Teste Devam Et</h2>
                    </div>
                    <div class="card-body p-4">
                        <p class="text-muted text-center mb-4">
                            Daha önce kaydettiğiniz teste kaldığınız yerden devam etmek için
                            TC Kimlik Numaranızı ve oturum kodunuzu girin.
                        </p>

                        <div id="errorMessage" class="alert alert-danger d-none">
                            <i class="fas fa-exclamation-triangle me-2"></i>
                            <span id="errorText"></span>
                        </div>

                        <form id="resumeForm">
                            <div class="mb-3">
                                <label for="tcNo" class="form-label">TC Kimlik No</label>
                                <input type="text" class="form-control" id="tcNo" maxlength="11" required
                                    placeholder="11 haneli TC kimlik numaranız">
                            </div>

                            <div class="mb-3">
                                <label for="sessionCode" class="form-label">Oturum Kodu</label>
                                <input type="text" class="form-control" id="sessionCode" maxlength="11" required
                                    placeholder="Kayıt sırasında verilen 11 haneli kod"
                                    style="text-transform: uppercase; letter-spacing: 2px; font-size: 1.4rem; font-weight: bold; text-align: center;">
                            </div>

                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary btn-lg" id="resumeBtn">
                                    <i class="fas fa-play"></i> Teste Devam Et
                                </button>
                            </div>
                        </form>

                        <hr class="my-4">

                        <div class="text-center">
                            <p class="text-muted mb-0">Henüz bir test kaydetmediniz mi?</p>
                            <a href="testebasla.html" class="btn btn-outline-primary mt-2">
                                <i class="fas fa-plus"></i> Yeni Teste Başla
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        $(document).ready(function () {
            // TC No sadece rakam
            $('#tcNo').on('input', function () {
                $(this).val($(this).val().replace(/[^0-9]/g, ''));
            });

            // Oturum kodu büyük harf
            $('#sessionCode').on('input', function () {
                $(this).val($(this).val().toUpperCase().replace(/[^A-Z0-9]/g, ''));
            });

            $('#resumeForm').on('submit', async function (e) {
                e.preventDefault();
                $('#errorMessage').addClass('d-none');

                const tcNo = $('#tcNo').val().trim();
                const sessionCode = $('#sessionCode').val().trim();

                if (tcNo.length !== 11) {
                    showError('TC Kimlik No 11 haneli olmalıdır.');
                    return;
                }
                if (sessionCode.length !== 11) {
                    showError('Oturum kodu 11 karakter olmalıdır.');
                    return;
                }

                $('#resumeBtn').prop('disabled', true).html('<span class="spinner-border spinner-border-sm"></span> Kontrol ediliyor...');

                try {
                    const result = await lookupSession(tcNo, sessionCode);
                    if (result) {
                        restoreSession(result);
                    }
                } catch (err) {
                    showError(err.message || 'Oturum bulunamadı. Lütfen bilgilerinizi kontrol edin.');
                } finally {
                    $('#resumeBtn').prop('disabled', false).html('<i class="fas fa-play"></i> Teste Devam Et');
                }
            });
        });

        async function lookupSession(tcNo, sessionCode) {
            if (typeof PG_API === 'undefined' || !PG_API) {
                throw new Error('Veritabanı bağlantısı kurulamadı.');
            }

            // Önce katılımcıyı TC No ile bul
            const { data: participants, error: pErr } = await PG_API
                .from('participants')
                .select('id, first_name, last_name, tc_no, gender, age, institution_code, institution_name, profession, education, marital_status')
                .eq('tc_no', tcNo)
                .limit(1);

            if (pErr) {
                console.error('Katılımcı sorgu hatası:', pErr);
                throw new Error('Veritabanı hatası oluştu.');
            }
            if (!participants || participants.length === 0) {
                throw new Error('Bu TC Kimlik No ile kayıtlı katılımcı bulunamadı.');
            }

            const participant = participants[0];

            // Devam etmekte olan testi oturum kodu ile bul
            const { data: tests, error: tErr } = await PG_API
                .from('test_results')
                .select('id, test_answers, current_index, dont_know_count, start_time, status, session_code, completed_questions')
                .eq('participant_id', participant.id)
                .eq('session_code', sessionCode)
                .in('status', ['started', 'in_progress'])
                .order('created', { ascending: false })
                .limit(1);

            if (tErr) {
                console.error('Test sorgu hatası:', tErr);
                throw new Error('Veritabanı hatası oluştu.');
            }
            if (!tests || tests.length === 0) {
                throw new Error('Bu bilgilere ait kaydedilmiş bir oturum bulunamadı. Oturum kodunuzu kontrol edin.');
            }

            return { participant, testResult: tests[0] };
        }

        function restoreSession(data) {
            const p = data.participant;
            const t = data.testResult;

            // Katılımcı bilgilerini localStorage'a yükle
            const genderMap = { 'erkek': 'male', 'kadin': 'female', 'other': 'other' };
            const personalInfo = {
                firstName: p.first_name,
                lastName: p.last_name,
                tcNo: p.tc_no,
                gender: genderMap[p.gender] || p.gender,
                age: p.age,
                institutionCode: p.institution_code || '',
                institutionName: p.institution_name || '',
                profession: p.profession || '',
                education: p.education || '',
                maritalStatus: p.marital_status || ''
            };
            localStorage.setItem('mmpiPersonalInfo', JSON.stringify(personalInfo));

            // Katılımcı ID
            localStorage.setItem('mmpiParticipantId', p.id);

            // KVKK onayını ayarla
            localStorage.setItem('kvkkConsent', 'true');
            localStorage.setItem('kvkkConsentDate', new Date().toISOString());

            // Test ilerlemesini yükle
            const currentIndex = t.current_index || 0;
            const answers = t.test_answers || {};
            const dontKnowCount = t.dont_know_count || 0;
            const startTime = t.start_time || new Date().toISOString();

            const progress = {
                currentQuestionIndex: currentIndex,
                answers: answers,
                dontKnowCount: dontKnowCount,
                startTime: startTime,
                lastSaved: new Date().toISOString()
            };
            localStorage.setItem('mmpiTestProgress', JSON.stringify(progress));

            // Oturum kodunu localStorage'a kaydet
            localStorage.setItem('mmpiSessionCode', t.session_code || '');

            // Başlangıç zamanını ayarla
            localStorage.setItem('mmpiTestStartTime', startTime);

            // Test sayfasına yönlendir
            window.location.href = 'mmpi-test.html?resume=1';
        }

        function showError(message) {
            $('#errorText').text(message);
            $('#errorMessage').removeClass('d-none');
        }
    </script>
</body>
</html>
