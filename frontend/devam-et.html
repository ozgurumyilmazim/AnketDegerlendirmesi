<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste Devam Et - MMPI Psikolojik Test Sistemi</title>
    <link rel="icon" type="image/svg+xml" href="favicon.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>
    <div class="container-fluid min-vh-100 d-flex align-items-center justify-content-center bg-light">
        <div class="row w-100">
            <div class="col-md-8 col-lg-5 mx-auto">
                <div class="card shadow-lg border-0">
                    <div class="card-header bg-primary text-white text-center">
                        <h2 class="mb-0"><i class="fas fa-play-circle me-2"></i>Teste Devam Et</h2>
                    </div>
                    <div class="card-body p-4">
                        <p class="text-muted text-center mb-4">
                            Daha önce kaydettiğiniz teste kaldığınız yerden devam etmek için bilgilerinizi girin.
                        </p>

                        <div id="errorMessage" class="alert alert-danger" style="display: none;">
                            <i class="fas fa-exclamation-triangle me-2"></i>
                            <span id="errorText"></span>
                        </div>

                        <div id="successMessage" class="alert alert-success" style="display: none;">
                            <i class="fas fa-check-circle me-2"></i>
                            <span id="successText"></span>
                        </div>

                        <form id="resumeForm">
                            <div class="mb-4">
                                <label for="tcNo" class="form-label">TC Kimlik No</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fas fa-id-card"></i></span>
                                    <input type="text" class="form-control" id="tcNo" maxlength="11"
                                        placeholder="11 haneli TC kimlik numaranız" required>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label for="saveCode" class="form-label">Kayıt Kodu</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fas fa-key"></i></span>
                                    <input type="text" class="form-control" id="saveCode" maxlength="11"
                                        placeholder="11 haneli kayıt kodunuz" required
                                        style="text-transform: uppercase; letter-spacing: 2px;">
                                </div>
                                <div class="form-text">
                                    Testi kaydettiğinizde size gösterilen 11 haneli kodu girin.
                                </div>
                            </div>

                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary btn-lg" id="resumeBtn">
                                    <i class="fas fa-play me-2"></i>Teste Devam Et
                                </button>
                                <a href="index.html" class="btn btn-outline-secondary">
                                    <i class="fas fa-home me-2"></i>Ana Sayfaya Dön
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/pg-config.js"></script>
    <script src="assets/js/devam-et.js"></script>
</body>
</html>
